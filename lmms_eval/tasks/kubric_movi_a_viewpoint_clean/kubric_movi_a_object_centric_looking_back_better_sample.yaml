dataset_name: null
test_split: test
task: "kubric_movi_a_object_centric_looking_back_better_sample"
include: _default_template_yaml
dataset_kwargs:
  data_files:
    test: /home/ramanathan/data/movi_a_3dsr_better_sample/movi_a_validation.parquet

# The source parquet also contains camera-relative and height tasks.  Retain
# only anchor-object tasks and evaluate vectors in the anchor-facing frame.
process_docs: !function utils.process_object_centric_looking_back_docs

metric_list:
