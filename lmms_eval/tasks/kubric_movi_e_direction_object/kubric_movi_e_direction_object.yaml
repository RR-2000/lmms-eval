dataset_path: parquet
dataset_name: null
dataset_kwargs:
  data_files:
    test: /home/ramanathan/data/movi_e_better_sample/movi_e_validation_direction_object.parquet

task: kubric_movi_e_direction_object
test_split: test
output_type: generate_until
process_docs: !function utils.process_docs
doc_to_visual: !function utils.doc_to_visual
doc_to_text: !function utils.doc_to_text
doc_to_target: !function utils.doc_to_target
process_results: !function utils.process_results

generation_kwargs:
  max_new_tokens: 16
  temperature: 0.0
  top_p: 1.0
  do_sample: false

metric_list:
  - metric: accuracy
    aggregation: !function utils.aggregate_accuracy
    higher_is_better: true
  - metric: object_answer_accuracy
    aggregation: !function utils.aggregate_object_answer_accuracy
    higher_is_better: true
  - metric: direction_answer_accuracy
    aggregation: !function utils.aggregate_direction_answer_accuracy
    higher_is_better: true
  - metric: format_switch_gain
    aggregation: !function utils.aggregate_format_switch_gain
    higher_is_better: true
  - metric: object_minus_direction
    aggregation: !function utils.aggregate_object_minus_direction
    higher_is_better: true
  - metric: parse_success_rate
    aggregation: !function utils.aggregate_parse_success_rate
    higher_is_better: true
  - metric: object_parse_success_rate
    aggregation: !function utils.aggregate_object_parse_success_rate
    higher_is_better: true
  - metric: direction_parse_success_rate
    aggregation: !function utils.aggregate_direction_parse_success_rate
    higher_is_better: true
  - metric: submission
    aggregation: !function utils.aggregate_results_for_submission
    higher_is_better: false

lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""

metadata:
  - version: 1.0
