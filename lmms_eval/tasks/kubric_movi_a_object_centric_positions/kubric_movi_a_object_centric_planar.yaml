dataset_name: null
test_split: test
task: kubric_movi_a_object_centric_planar
include: _default_template_yaml
doc_to_text: !function utils.doc_to_text_planar

metric_list:
  - metric: viewpoint_answer_accuracy
    aggregation: !function utils.aggregate_viewpoint_answer_accuracy
    higher_is_better: true
  - metric: object_centric_relative_position_viewpoint_answer_and_direction_correct
    aggregation: !function utils.aggregate_object_centric_relative_position_viewpoint_answer_and_direction_correct
    higher_is_better: true
  - metric: object_centric_relative_position_viewpoint_answer_correct_direction_wrong
    aggregation: !function utils.aggregate_object_centric_relative_position_viewpoint_answer_correct_direction_wrong
    higher_is_better: true
  - metric: object_centric_relative_position_viewpoint_answer_wrong_direction_correct
    aggregation: !function utils.aggregate_object_centric_relative_position_viewpoint_answer_wrong_direction_correct
    higher_is_better: true
  - metric: object_centric_relative_position_viewpoint_answer_and_direction_wrong
    aggregation: !function utils.aggregate_object_centric_relative_position_viewpoint_answer_and_direction_wrong
    higher_is_better: true
  - metric: submission
    aggregation: !function utils.aggregate_planar_results_for_submission
    higher_is_better: false
