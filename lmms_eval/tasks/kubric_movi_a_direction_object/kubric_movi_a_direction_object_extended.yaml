dataset_name: null
test_split: test
task: "kubric_movi_a_direction_object_extended"
include: _default_template_yaml

process_docs: !function utils.extended_process_docs
doc_to_visual: !function utils.doc_to_visual
doc_to_text: !function utils.extended_doc_to_text
doc_to_target: !function utils.extended_doc_to_target
process_results: !function utils.extended_process_results

metric_list:
  - metric: accuracy
