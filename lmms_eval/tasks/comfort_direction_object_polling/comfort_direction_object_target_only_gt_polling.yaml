dataset_path: json
dataset_name: null
dataset_kwargs:
  data_files:
    test: /home/ramanathan/data/COMFORT_Multi_3D/annotations.jsonl
task: "comfort_direction_object_target_only_gt_polling"
test_split: test
output_type: generate_until
process_docs: !function target_only_gt_utils.process_docs
doc_to_visual: !function target_only_gt_utils.doc_to_visual
doc_to_text: !function target_only_gt_utils.doc_to_text
doc_to_target: !function target_only_gt_utils.doc_to_target
process_results: !function target_only_gt_utils.process_results

generation_kwargs:
  max_new_tokens: 16
  temperature: 0.0
  top_p: 1.0
  num_beams: 1
  do_sample: false

metric_list:
  - metric: accuracy
    aggregation: !function target_only_gt_utils.aggregate_accuracy
    higher_is_better: true
  - metric: target_poll_accuracy
    aggregation: !function target_only_gt_utils.aggregate_target_poll_accuracy
    higher_is_better: true
  - metric: target_positive_accuracy
    aggregation: !function target_only_gt_utils.aggregate_target_positive_accuracy
    higher_is_better: true
  - metric: target_negative_accuracy
    aggregation: !function target_only_gt_utils.aggregate_target_negative_accuracy
    higher_is_better: true
  - metric: final_direction_accuracy
    aggregation: !function target_only_gt_utils.aggregate_final_direction_accuracy
    higher_is_better: true
  - metric: direction_selection_coverage
    aggregation: !function target_only_gt_utils.aggregate_direction_selection_coverage
    higher_is_better: true
  - metric: ambiguous_direction_rate
    aggregation: !function target_only_gt_utils.aggregate_ambiguous_direction_rate
    higher_is_better: false
  - metric: exact_poll_set_accuracy
    aggregation: !function target_only_gt_utils.aggregate_exact_poll_set_accuracy
    higher_is_better: true
  - metric: parse_success_rate
    aggregation: !function target_only_gt_utils.aggregate_parse_success_rate
    higher_is_better: true
  - metric: submission
    aggregation: !function target_only_gt_utils.aggregate_results_for_submission
    higher_is_better: false

lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""

metadata:
  - version: 1.0
